# Monthly, grouped updates: at most one pull request for the GitHub Actions and one for the dev
# tools. The package has no runtime dependencies, so none of this reaches its users.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        dependency-type: development
