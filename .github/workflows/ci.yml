name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # package.json promises Node 18 or newer. The dev tools need a newer Node, so the built package
  # is checked on its own on each version, imported by name as users do.
  node:
    name: Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke.mjs
